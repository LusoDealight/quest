<title>Quest · La Tour</title>
<meta name="theme-color" content="#2f6b45">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Jeu Quest : la Ville (menus) + l'étage 1 (carte en canvas). Ouvert uniquement pendant une pause du minuteur. */
:root {
  --bg: #eef2ec; --surface: #ffffff; --surface-2: #e3eae1; --line: #cdd8cb;
  --fg: #1c2a22; --muted: #5b6d61; --accent: #2f7d4a; --accent-ink: #ffffff;
  --gold: #b9830d; --gold-soft: #f6e3b0; --sky: #3d7fa6; --sky-soft: #d6e8f2;
  --danger: #b3412e; --hp: #c8473a;
  --r-common: #6b7a70; --r-rare: #2f74c0; --r-epic: #8a4fc2; --r-legend: #c47f00;
  --font-display: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111915; --surface: #18221d; --surface-2: #202d26; --line: #2c3b33;
    --fg: #e3ece5; --muted: #93a699; --accent: #64c07f; --accent-ink: #0d1a12;
    --gold: #f0c04a; --gold-soft: #3b3218; --sky: #7cbde0; --sky-soft: #1b3240;
    --danger: #ec7b66; --hp: #ec7b66;
    --r-common: #a3b1a8; --r-rare: #6eaef0; --r-epic: #c08ff0; --r-legend: #f0c04a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111915; --surface: #18221d; --surface-2: #202d26; --line: #2c3b33;
  --fg: #e3ece5; --muted: #93a699; --accent: #64c07f; --accent-ink: #0d1a12;
  --gold: #f0c04a; --gold-soft: #3b3218; --sky: #7cbde0; --sky-soft: #1b3240;
  --danger: #ec7b66; --hp: #ec7b66;
  --r-common: #a3b1a8; --r-rare: #6eaef0; --r-epic: #c08ff0; --r-legend: #f0c04a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.display { font-family: var(--font-display); letter-spacing: .02em; }
.muted { color: var(--muted); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; font-weight: 600; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sky { background: var(--sky); color: var(--bg); border-color: var(--sky); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 13px; }

/* ---- Coque ---- */
.shell { max-width: 720px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.hud { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px; display: grid; gap: 6px; }
.hud-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hud-top a { font-weight: 600; color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
.pause-pill { background: var(--sky-soft); color: var(--sky); border-radius: 99px; padding: 2px 10px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.hud-stats { display: flex; align-items: center; gap: 14px; font-size: 14px; flex-wrap: wrap; }
.hud-stats > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.hpbar { width: 84px; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: inline-block; }
.hpbar > i { display: block; height: 100%; background: var(--hp); transition: width .3s; }
.bolt { width: 13px; height: 13px; flex: none; }
.coin { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); display: inline-block; box-shadow: inset -2px -2px 0 rgba(0,0,0,.18); }
.chip { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.chip.rested { background: var(--sky-soft); color: var(--sky); }
main { flex: 1; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 24px); display: grid; gap: 14px; align-content: start; }

/* ---- Mode essai (aperçu sans todo list) ---- */
.essai { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; padding-top: 6px; border-top: 1px dashed var(--line); }
.essai .chip { background: var(--gold-soft); color: var(--gold); }
.essai select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }

/* ---- Ville ---- */
.town-banner { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: #8fd0ef; }
.town-banner svg { display: block; width: 100%; height: auto; }
.title-row { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.title-row h2 { font-family: var(--font-display); font-size: 26px; }
.places { display: grid; gap: 10px; }
.place { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-align: left; width: 100%; }
.place:hover { border-color: var(--muted); }
.place h3 { font-size: 16px; }
.place p { margin: 0; font-size: 13px; color: var(--muted); }
.place .ico { width: 44px; height: 44px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); }
.place.gate { border-color: var(--accent); border-width: 2px; }
.place.gate .ico { background: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; }
.panel h3 { font-size: 16px; }
.back { justify-self: start; }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; text-align: left; display: grid; gap: 2px; }
.act b { font-size: 14px; }
.act small { color: var(--muted); font-size: 12px; }
.act:hover { border-color: var(--sky); }
.big-count { font-family: var(--font-display); font-size: 56px; text-align: center; color: var(--sky); line-height: 1; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
.item.eq { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.item .nm { font-weight: 700; overflow-wrap: anywhere; }
.item .st { font-size: 13px; color: var(--muted); }
.item .bt { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
.dur { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 4px; max-width: 160px; }
.dur > i { display: block; height: 100%; background: var(--accent); }
.dur > i.low { background: var(--danger); }
.rar-0 { color: var(--r-common); } .rar-1 { color: var(--r-rare); } .rar-2 { color: var(--r-epic); } .rar-3 { color: var(--r-legend); }
.skills { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.skills li { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: start; }
.skills li.off { opacity: .5; }
.skills .pip { width: 10px; height: 10px; border-radius: 2px; background: var(--gold); margin-top: 6px; }
.skills li.off .pip { background: var(--line); }
.statline { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.statline b { font-size: 18px; }
.qlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.qlist li { display: grid; gap: 2px; }
.qlist .done { color: var(--muted); text-decoration: line-through; }
.hint { border-left: 3px solid var(--gold); padding: 6px 10px; background: var(--gold-soft); border-radius: 0 8px 8px 0; font-style: italic; }

/* ---- Étage ---- */
body.floor { overflow: hidden; }
body.floor .shell { height: 100%; max-width: none; }
body.floor main { padding: 0; position: relative; flex: 1; min-height: 0; display: block; }
#stage { position: absolute; inset: 0; background: #2f7a3b; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
.floor-loading { position: absolute; inset: 0; display: grid; place-items: center; color: #f1f5ef; font-family: var(--font-display); font-size: 20px; }
.zoom { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; }
.zoom .btn { width: 40px; height: 40px; padding: 0; font-size: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
#minimap { position: absolute; top: 48px; left: max(12px, env(safe-area-inset-left, 0px)); border: 2px solid rgba(16,26,20,.8); border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; image-rendering: pixelated; }
.sheet-bg.clear { background: transparent; pointer-events: none; }
.sheet-bg.clear .sheet { pointer-events: auto; box-shadow: 0 -6px 24px rgba(0,0,0,.25); gap: 8px; }
.sheet-bg.clear { align-items: end !important; }
.sheet-bg.clear .sheet { max-width: 640px; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); gap: 6px; }
@media (min-width: 600px) { .sheet-bg.clear .sheet { margin-bottom: 12px; } }
.sheet-bg.clear .cacts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 460px) { .sheet-bg.clear .cacts { grid-template-columns: 1fr 1fr; } }
.sheet-bg.clear .cacts .btn { padding: 9px 6px; }
.sheet-bg.clear .clog { min-height: 0; font-size: 13px; }
.sheet-bg.clear .intent { min-height: 0; }
.dmg { position: fixed; z-index: 45; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: 28px; color: #fff;
  text-shadow: 0 2px 0 #1c2a22, 0 0 8px rgba(0,0,0,.45); transform: translate(-50%, -50%); animation: dmgUp .9s ease-out forwards; }
.dmg.hurt { color: #ff6b5e; }
@keyframes dmgUp { from { opacity: 1; margin-top: 0; } 70% { opacity: 1; } to { opacity: 0; margin-top: -54px; } }
#joy { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); width: 124px; height: 124px;
  border-radius: 50%; background: rgba(16,26,20,.25); border: 2px solid rgba(255,255,255,.5); touch-action: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,255,255,.88); box-shadow: 0 2px 8px rgba(0,0,0,.3); pointer-events: none; }
.act-btn { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); box-shadow: 0 2px 10px rgba(0,0,0,.3); }
.act-btn[hidden], #joy[hidden] { display: none; }
.modes { display: grid; gap: 8px; }
.modes label { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.modes label.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.modes input { margin-top: 3px; accent-color: var(--accent); }
.modes span { display: grid; gap: 2px; }
.modes small { color: var(--muted); font-size: 13px; }
.duel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.duel > div { display: grid; gap: 3px; font-size: 14px; }
.duel .hpbar { width: 100%; }
.floor-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: space-between; align-items: end;
  padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); pointer-events: none; }
.floor-bar > * { pointer-events: auto; }
.floor-msg { flex: 1; min-width: 0; background: rgba(16,26,20,.82); color: #f1f5ef; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.floor-bar .btn { box-shadow: 0 2px 8px rgba(0,0,0,.25); }
@media (max-width: 560px) {
  .floor-bar { flex-wrap: wrap; }
  .floor-msg { order: -1; flex-basis: 100%; font-size: 12.5px; }
  .floor-bar .btn { flex: 1; }
}
#joy { bottom: calc(env(safe-area-inset-bottom, 0px) + var(--barh, 64px) + 10px) !important; }
.act-btn { bottom: calc(env(safe-area-inset-bottom, 0px) + var(--barh, 64px) + 10px) !important; }
.floor-name { position: absolute; top: 10px; left: 12px; background: rgba(16,26,20,.78); color: #f1f5ef; font-family: var(--font-display); padding: 2px 10px; border-radius: 6px; font-size: 15px; pointer-events: none; }

/* ---- Combat & fenêtres ---- */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(10,16,12,.55); display: grid; align-items: end; justify-items: center; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 14px 14px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 12px; max-height: 92vh; overflow: auto; }
@media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 14px; } }
.sheet h2 { font-family: var(--font-display); font-size: 22px; }
.intent { font-size: 12px; font-weight: 700; color: var(--danger); min-height: 18px; }
.clog { font-size: 14px; min-height: 44px; display: grid; gap: 2px; }
.clog div:not(:last-child) { color: var(--muted); }
.cacts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cacts .btn { padding: 12px; }
.loot { display: grid; gap: 6px; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; }
.lock { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 28px 8px; }
.lock svg { width: 120px; height: auto; }
.lock h2 { font-family: var(--font-display); font-size: 26px; }
.lock p { margin: 0; max-width: 40ch; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 92px); z-index: 60; display: grid; gap: 6px; justify-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--fg); color: var(--bg); padding: 7px 14px; border-radius: 99px; font-weight: 600; font-size: 14px; animation: tin .25s ease; text-align: center; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head><body>
<div class="shell">
  <header class="hud" id="hud">
    <div class="hud-top">
      <a href="./#quetes" aria-label="Retour à la todo list">← Todo list</a>
      <span class="display" style="font-size:18px">La Tour</span>
      <span class="pause-pill num" id="pause-pill">--:--</span>
    </div>
    <div class="hud-stats" id="hud-stats"></div>
    <div class="essai" id="essai" hidden></div>
  </header>
  <main id="view"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="sheet-root"></div>

<script>
(() => {
"use strict";
/* ================= Lien avec la todo list =================
   La todo list (index.html) garde son état dans localStorage["quest.v1"] : XP, minuteur, journal des cycles, succès.
   Le jeu lit cet état sans le modifier, sauf pour débloquer les deux succès du jeu (boss, objet légendaire).
   Son propre état vit dans localStorage["quest.game.v1"]. */
const ESSAI = !!window.QUEST_ESSAI; // aperçu autonome : simule la todo list (rang, pauses, cycles)
const TODO_KEY = "quest.v1";
const GAME_KEY = "quest.game.v1";
const RANKS = [ // même table que la todo list
  { name: "Recrue", xp: 0 }, { name: "Éclaireur", xp: 60 }, { name: "Aventurier", xp: 150 }, { name: "Vétéran", xp: 280 },
  { name: "Champion", xp: 450 }, { name: "Héros", xp: 700 }, { name: "Légende de la Tour", xp: 1000 },
];
const SKILLS = [
  { name: "Persévérance", game: "Chaque attaque enchaînée frappe 1 point plus fort (jusqu'à +2)." },
  { name: "Vision claire", game: "La lanterne montre les fleurs de rosée de loin et l'intention des monstres en combat." },
  { name: "Coup précis", game: "Une fois par combat : dégâts doublés." },
  { name: "Garde", game: "Une fois par combat : bloque entièrement le prochain coup." },
  { name: "Endurance", game: "Chaque cycle de focus donne 4 énergie au lieu de 3 ; réserve max 12." },
  { name: "Élan", game: "Déplacement plus rapide, fuite toujours réussie, monter un étage coûte 1 énergie." },
  { name: "Ascension", game: "+2 en attaque. Le sommet t'attend." },
];
const RARITY = ["Commun", "Rare", "Épique", "Légendaire"];
const ITEM_NAMES = {
  weapon: ["Bâton de saule", "Dague de rosée", "Lame des prés", "Épée de l'aube"],
  armor:  ["Tunique de lin", "Gilet de cuir", "Cotte de mousse", "Armure du chêne ancien"],
  charm:  ["Trèfle à quatre feuilles", "Galet poli", "Ambre de la prairie", "Cœur de slime royal"],
};
const ITEM_NAMES2 = { // à partir de l'étage 2
  weapon: ["Hachette de bûcheron", "Lance de frêne", "Épée d'ambre", "Lame du Grand Cerf"],
  armor:  ["Veste de feuilles", "Cuir de loup", "Cotte d'écorce", "Armure d'automne"],
  charm:  ["Gland porte-bonheur", "Plume de chouette", "Larme de résine", "Cœur de chêne"],
};
const DUR_MAX = [20, 30, 40, 60];  // usure : nombre de combats avant de casser (Commun → Légendaire)
const ELIXIR_PRICE = 20, ELIXIR_HEAL = 30, KIT_PRICE = 12, KIT_FIX = 10;
const SLOT_NAME = { weapon: "Arme", armor: "Armure", charm: "Talisman" };
const ACTIVITIES = [
  { id: "marcher",  name: "Marcher", desc: "Fais quelques pas, même dans le couloir." },
  { id: "boire",    name: "Boire de l'eau", desc: "Un grand verre, sans écran." },
  { id: "loin",     name: "Regarder au loin", desc: "Fixe un point à plus de 6 m, par la fenêtre." },
  { id: "etirer",   name: "T'étirer", desc: "Épaules, nuque, dos." },
  { id: "respirer", name: "Respirer", desc: "Inspire 4 s, expire 6 s." },
];
const REST_SECONDS = 60;
const POTION_PRICE = 8, POTION_HEAL = 12;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const fmt = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const todayKey = (d = new Date()) => { const z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };

function readTodo() { try { return JSON.parse(localStorage.getItem(TODO_KEY)) || null; } catch (e) { return null; } }
let TODO = readTodo();
const xp = () => (TODO && TODO.xp) || 0;
const rankIdx = () => { let i = 0; RANKS.forEach((r, k) => { if (xp() >= r.xp) i = k; }); return i; };
const hasSkill = k => rankIdx() >= k;
function totalCycles() { if (!TODO || !TODO.log) return 0; return Object.values(TODO.log).reduce((a, d) => a + (d.cycles || 0), 0); }
function pauseInfo() {
  const t = TODO && TODO.timer;
  if (!t || t.phase !== "pause") return null;
  const held = t.remaining != null;
  const left = held ? t.remaining : t.endAt - Date.now();
  if (left <= 0) return null;
  return { id: String(t.startedAt), left, held, kind: t.kind };
}
function todoUnlock(id) { // succès partagés avec la todo list
  try {
    const d = readTodo(); if (!d) return;
    d.ach = d.ach || {};
    if (d.ach[id]) return;
    d.ach[id] = todayKey();
    localStorage.setItem(TODO_KEY, JSON.stringify(d));
    TODO = d;
    toast(`Succès : ${id === "boss" ? "Roi des slimes" : "Trouvaille légendaire"}`);
  } catch (e) {}
}

/* ================= État du jeu ================= */
function newGame() {

    lv: null, ckpt: 0, best: 1, regen: 0, shop: null, // lv : étage en cours (montée), ckpt : dernière Halte atteinte
    energy: 3, cyclesSeen: null,

    pauseId: null, rested: false, rest: null,
    pos: null, opts: { move: "auto", amb: "arcane", q: "haute" },

    q2: newQ2(),
  };
}
function newQ2() { return { v: 1, acc: {}, done: {}, wolves: 0, shrooms: 0, spores: 0, got: [], fires: [], chest: false, bridge: false, sylvain: false, emile: 0, cerf: false }; }
let G;
function loadGame() {
  try { const raw = localStorage.getItem(GAME_KEY); if (raw) { const d = JSON.parse(raw); G = Object.assign(newGame(), d); G.q = d.q && d.q.v === 2 ? Object.assign(newGame().q, d.q) : newGame().q; G.q2 = Object.assign(newQ2(), d.q2 || {}); fixItems(); return; } } catch (e) {}
  G = newGame();
}
function fixItems() { // anciennes sauvegardes : objets sans usure
  G.items.forEach(it => { it.tier = it.tier || 1; if (it.durMax == null) { it.durMax = DUR_MAX[it.rarity] + 6 * (it.tier - 1); it.dur = it.durMax; } });
  if (G.q.floor2) G.best = Math.max(G.best || 1, 2);
}
function save() { try { localStorage.setItem(GAME_KEY, JSON.stringify(G)); } catch (e) {} }
loadGame();

const itemById = id => G.items.find(i => i.id === id);
const eq = slot => itemById(G.equip[slot]);
function itemStat(it) {
  const r = it.rarity, l = it.lvl, t = (it.tier || 1) - 1;
  if (it.slot === "weapon") return { atk: [1, 2, 4, 7][r] + l + t };
  if (it.slot === "armor") return { def: [1, 2, 3, 5][r] + Math.floor((l + 1) / 2) + Math.floor((t + 1) / 2) };
  return { hp: [3, 6, 10, 16][r] + 2 * l + 3 * t };
}
const statText = it => { const s = itemStat(it); return s.atk ? `+${s.atk} attaque` : s.def ? `+${s.def} défense` : `+${s.hp} PV max`; };
const upCost = it => [5, 10, 20, 40][it.rarity] * (it.lvl + 1);
const sellPrice = it => Math.round([3, 8, 20, 50][it.rarity] * (1 + it.lvl / 2) * (1 + ((it.tier || 1) - 1) * 0.4) * (it.dur > 0 ? 1 : 0.4));
const buyPrice = it => Math.round(sellPrice({ ...it, dur: 1 }) * 2.6);
const durMaxOf = it => DUR_MAX[it.rarity] + 6 * ((it.tier || 1) - 1);
const repairCost = it => Math.ceil((it.durMax - it.dur) * [1, 1.6, 2.4, 4][it.rarity] * 0.5);
const working = it => it && it.dur > 0; // un objet cassé ne donne plus son bonus
const durText = it => it.dur <= 0 ? `<b style="color:var(--danger)">cassé</b>` : `durabilité ${it.dur} / ${it.durMax}`;
const maxTrain = () => 2 + rankIdx() * 2;
const trainCost = () => 15 * (G.train + 1);
function maxHp() { const c = eq("charm"); return 20 + 4 * rankIdx() + 3 * G.train + (working(c) ? itemStat(c).hp : 0); }
function atk() { const w = eq("weapon"); return 2 + G.train + (working(w) ? itemStat(w).atk : 0) + (hasSkill(6) ? 2 : 0); }
function def() { const a = eq("armor"); return working(a) ? itemStat(a).def : 0; }
// Usure après un combat : l'arme si tu as frappé, l'armure si tu as été touché, le talisman à chaque combat.
function wearAfterFight(hit, hurt, boss) {
  const k = boss ? 2 : 1, msgs = [];
  [["weapon", hit], ["armor", hurt], ["charm", true]].forEach(([sl, used]) => {
    const it = eq(sl); if (!it || !used || it.dur <= 0) return;
    const before = it.dur; it.dur = Math.max(0, it.dur - k);
    if (it.dur === 0) msgs.push(`${esc(it.name)} est cassé !`);
    else if (before > it.durMax * 0.25 && it.dur <= it.durMax * 0.25) msgs.push(`${esc(it.name)} est très usé`);
  });
  G.hp = Math.min(G.hp ?? maxHp(), maxHp());
  msgs.forEach(m => toast(m));
}
const perCycle = () => (hasSkill(4) ? 4 : 3);
const energyCap = () => (hasSkill(4) ? 12 : 10);

function syncEnergy() {
  const tot = totalCycles();
  if (G.cyclesSeen == null || tot < G.cyclesSeen) { G.cyclesSeen = tot; save(); return; }
  if (tot > G.cyclesSeen) {
    const gain = (tot - G.cyclesSeen) * perCycle();
    G.cyclesSeen = tot;
    const before = G.energy;
    G.energy = Math.min(energyCap(), G.energy + gain);
    save();
    if (G.energy > before) toast(`+${G.energy - before} énergie (cycles de focus)`);
  }
}
function onNewPause(p) {
  if (G.pauseId === p.id) return;
  G.pauseId = p.id; G.rested = false; G.rest = null;
  if (!G.lv || G.lv === "e1") { G.lv = null; G.pos = null; }
  // la pause soigne… sauf en pleine montée : entre deux Haltes, pas de repos
  if (!G.lv || isHalte()) G.hp = maxHp();
  save();
}
function makeItem(rarity, slot, tier) {
  slot = slot || ["weapon", "armor", "charm"][rnd(0, 2)];
  tier = tier || levelNum();
  const it = { id: uid(), slot, rarity, lvl: 0, tier, name: (tier > 1 ? ITEM_NAMES2 : ITEM_NAMES)[slot][rarity] };
  it.durMax = it.dur = durMaxOf(it);
  return it;
}
function rollRarity(boss) {
  const w = boss ? [0, 55, 35, 10] : G.rested ? [50, 32, 14, 4] : levelNum() > 1 ? [58, 28, 11, 3] : [70, 22, 7, 1];
  let x = Math.random() * 100;
  for (let i = 0; i < 4; i++) { if ((x -= w[i]) < 0) return i; }
  return 0;
}
function giveItem(it) {
  G.items.push(it);

}

  const key = (x, y) => y * MW + x, prev = new Map([[key(s.x, s.y), null]]), q = [s];
  const isGoal = p => goals.some(g => g.x === p.x && g.y === p.y);
  while (q.length) {
    const c = q.shift();
    if (isGoal(c)) { const out = []; let p = c; while (p && !(p.x === s.x && p.y === s.y)) { out.unshift(p); p = prev.get(key(p.x, p.y)); } return out; }
    for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const n = { x: c.x + a, y: c.y + b }, k = key(n.x, n.y);
      if (prev.has(k)) continue;
      if (!walkable(n.x, n.y) && !isGoal(n)) continue;
      prev.set(k, c); q.push(n);
    }
  }

}

  const coal = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.06), mat("#ff7a2a", { em: "#ff5a1a", ei: 1 })); g.add(at(coal, 0.4, 0.55, 0.41)); g.userData.coal = coal;
  const anvil = new THREE.Group(); anvil.add(at(box(0.55, 0.2, 0.28, mat("#4f555a")), 0, 0.5, 0)); anvil.add(at(box(0.26, 0.4, 0.22, mat("#4f555a")), 0, 0.2, 0));
  g.add(at(anvil, -0.8, 0, 0.3));
  return g;
}
useLevel("e1");

/* ================= Événements ================= */
document.addEventListener("click", e => {
  if (e.target.id === "minimap") { e.target.classList.toggle("big"); return; }
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); closeSheet(); go(g.dataset.go); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case "rest": G.rest = { id, endAt: Date.now() + REST_SECONDS * 1000 }; break;
    case "rest-cancel": G.rest = null; break;
    case "rest-done": if (G.rest && Date.now() >= G.rest.endAt) { G.rested = true; G.rest = null; G.hp = maxHp(); toast("Reposé : meilleur butin pour cette pause"); } break;
    case "buy-potion": if (G.gold >= POTION_PRICE) { G.gold -= POTION_PRICE; G.potions++; } break;
    case "buy-elixir": if (G.gold >= ELIXIR_PRICE) { G.gold -= ELIXIR_PRICE; G.elixirs++; } break;
    case "buy-kit": if (G.gold >= KIT_PRICE) { G.gold -= KIT_PRICE; G.kits++; } break;
    case "buy-item": { const s = G.shop && G.shop.items.find(x => x.id === id); if (s && G.gold >= buyPrice(s)) { G.gold -= buyPrice(s); G.shop.items = G.shop.items.filter(x => x !== s); giveItem(s); toast(`${esc(s.name)} ${G.equip[s.slot] === s.id ? "équipé" : "dans ton sac"}`); } break; }
    case "repair": { const it = itemById(id); if (it && G.gold >= repairCost(it)) { G.gold -= repairCost(it); it.dur = it.durMax; toast(`${esc(it.name)} réparé`); } break; }
    case "repair-all": { const c = repairAllCost(); if (c && G.gold >= c) { G.gold -= c; G.items.forEach(i => { i.dur = i.durMax; }); toast("Tout ton équipement est réparé"); } break; }
    case "use-potion": if (G.potions) { G.potions--; G.hp = Math.min(maxHp(), (G.hp ?? maxHp()) + POTION_HEAL); } break;
    case "use-elixir": if (G.elixirs) { G.elixirs--; G.hp = Math.min(maxHp(), (G.hp ?? maxHp()) + ELIXIR_HEAL); } break;
    case "use-kit": if (G.kits) { G.kits--; ["weapon", "armor", "charm"].forEach(sl => { const it = eq(sl); if (it) it.dur = Math.min(it.durMax, it.dur + KIT_FIX); }); toast("Équipement rafistolé"); } break;
    case "heal": healAtFountain(); return;
    case "enter": closeSheet(); enterLevel(id); return;
    case "leave": leaveTower(false); return;
    case "back-floor": go("etage"); return;
    case "bag": bagSheet(); return;
    case "equip": { const it = itemById(id); const ratio = (G.hp ?? maxHp()) / maxHp(); G.equip[it.slot] = id; G.hp = Math.max(1, Math.round(ratio * maxHp())); break; }
    case "upgrade": { const it = itemById(id); if (G.gold >= upCost(it) && it.lvl < 5) { G.gold -= upCost(it); it.lvl++; toast(`${esc(it.name)} +${it.lvl}`); } break; }
    case "sell": { const it = itemById(id); if (G.equip[it.slot] !== id) { G.gold += sellPrice(it); G.items = G.items.filter(x => x !== it); } break; }
    case "train": if (G.train < maxTrain() && G.gold >= trainCost()) { G.gold -= trainCost(); G.train++; G.hp = (G.hp ?? maxHp()) + 3; toast("Entraînement : +1 attaque, +3 PV max"); } break;
    case "journal-sheet": journalSheet(); return;
    case "zoom-in": if (F) F.zoom = Math.max(5, F.zoom - 2); return;
    case "zoom-out": if (F) F.zoom = Math.min(22, F.zoom + 2); return;
    case "cam-reset": if (F) { F.yaw = 0; F.pitch = 1.0; F.zoom = 12; } return;
    case "settings": settingsSheet(); return;
    case "interact": doInteract(); return;
    default: return;
  }
  save();
  if (sheetRefresh && sheetOpen()) { renderHUD(); sheetRefresh(); } else render();
});

/* ================= Horloge : pause, énergie ================= */
function tick() {
  TODO = readTodo();
  syncEnergy();
  const p = pauseInfo();
  const ok = !!p && !p.held;
  if (ok) onNewPause(p);
  if (ok !== !locked) {
    const wasPlaying = !locked;
    locked = !ok;
    if (locked && wasPlaying) {
      stopFloor(); C = null; save();
      render();
      info("Pause terminée", `<p>Ta progression est sauvegardée. Retour au travail : le prochain focus te redonnera ${perCycle()} énergie.</p>`, ESSAI ? "Fermer" : "Retour à la todo list", () => { if (!ESSAI) location.href = "./#minuteur"; });
      return;
    }
    if (!locked) scene = G.lv ? "etage" : "ville";
    render();
    return;
  }
  renderHUD();
  if (scene === "taverne" && G.rest) {
    const left = G.rest.endAt - Date.now(), el = $("#rest-count"), bt = $("#rest-btn");
    if (el) el.textContent = fmt(left);
    if (bt && left <= 0 && bt.disabled) { bt.disabled = false; bt.classList.add("primary"); }
  }
}
window.addEventListener("storage", e => { if (e.key === TODO_KEY) tick(); if (e.key === GAME_KEY) { loadGame(); if (!F) render(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
/* ---- Mode essai : remplace la todo list par quelques boutons ---- */
function essaiEdit(fn) {
  const d = readTodo() || { version: 1, xp: 150, subjects: [], ach: {}, settings: { sound: false }, log: {}, timer: { preset: "equilibre", phase: "idle", sinceLong: 0 } };
  fn(d); d.log = d.log || {};
  try { localStorage.setItem(TODO_KEY, JSON.stringify(d)); } catch (e) {}
  TODO = d; tick();
}
const essaiPause = d => { d.timer = { preset: "equilibre", phase: "pause", kind: "short", duration: 15 * 60000, startedAt: Date.now(), endAt: Date.now() + 15 * 60000, remaining: null, sinceLong: 0, earned: null }; };
// Aperçu : un héros équipé comme après l'étage 1, pour essayer directement l'étage 2 ou la Halte
function essaiKit() {
  if (G.items.length) return;
  [makeItem(2, "weapon", 1), makeItem(1, "armor", 1), makeItem(1, "charm", 1)].forEach(giveItem);
  G.train = Math.max(G.train, 2); G.potions = Math.max(G.potions, 3); G.elixirs = Math.max(G.elixirs, 1); G.gold = Math.max(G.gold, 60);
  G.hp = maxHp(); save();
  toast("Aperçu : équipement d'un héros qui a fini l'étage 1");
}
function renderEssai() {
  const el = $("#essai"); if (!el) return;
  el.hidden = false;
  el.innerHTML = `<span class="chip">Mode essai</span>
    <label for="essai-rank" class="muted">Rang</label>
    <select id="essai-rank">${RANKS.map((r, k) => `<option value="${r.xp}" ${k === rankIdx() ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select>
    <button class="btn small" data-act="essai-focus">+1 focus</button>
    <button class="btn small" data-act="essai-pause">Nouvelle pause</button>
    <button class="btn small ghost" data-act="essai-end">Finir la pause</button>
    <button class="btn small ghost" data-act="essai-reset">Tout recommencer</button>
    <label for="essai-tp" class="muted">Aller à</label>
    <select id="essai-tp"><option value="">…</option><option value="e1">Étage 1</option><option value="e2">Étage 2</option><option value="h5">Halte 5</option></select>
    <button class="btn small" data-act="essai-gold">+100 or</button>`;
}
if (ESSAI) {
  const back = document.querySelector('.hud-top a'); if (back) { back.removeAttribute("href"); back.textContent = "Aperçu"; back.setAttribute("aria-label", "Aperçu du jeu"); }
  if (!readTodo()) essaiEdit(essaiPause);
  renderEssai();
  document.addEventListener("change", e => {
    if (e.target.id === "essai-rank") { essaiEdit(d => { d.xp = +e.target.value; }); if (!F) render(); renderEssai(); }
    if (e.target.id === "essai-tp" && e.target.value) { const id = e.target.value; e.target.value = ""; if (locked) essaiEdit(essaiPause); G.energy = Math.max(G.energy, 6); G.best = Math.max(G.best, levelNum(id)); if (id === "h5") G.ckpt = Math.max(G.ckpt, 5); if (id !== "e1") essaiKit(); closeSheet(); C = null; G.lv = null; enterLevel(id); renderHUD(); }
  });
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act^=essai]"); if (!b) return;
    const a = b.dataset.act;
    if (a === "essai-focus") essaiEdit(d => { const k = todayKey(); d.log[k] = d.log[k] || { focus: 0, pause: 0, cycles: 0 }; d.log[k].cycles++; d.log[k].focus += 50; });
    if (a === "essai-pause") essaiEdit(essaiPause);
    if (a === "essai-gold") { G.gold += 100; save(); renderHUD(); if (sheetRefresh && sheetOpen()) sheetRefresh(); else if (!F) render(); }
    if (a === "essai-end") essaiEdit(d => { d.timer.endAt = Date.now() - 1; });
    if (a === "essai-reset") { try { localStorage.removeItem(GAME_KEY); } catch (err) {} closeSheet(); stopFloor(); loadGame(); scene = "ville"; essaiEdit(d => { essaiPause(d); d.log = {}; d.ach = {}; }); render(); }
  });
}
locked = !(pauseInfo() && !pauseInfo().held);
if (!locked) { onNewPause(pauseInfo()); scene = G.lv ? "etage" : "ville"; }
syncEnergy();
render();
setInterval(tick, 500);
// Accroche de test (jeu.html?debug) : utilisée seulement pour les tests automatisés.
if (/[?&]debug\b/.test(location.search)) window.__quest = { get G() { return G; }, get F() { return F; }, get C() { return C; }, get LV() { return LV; }, routeTo: (x, y) => routeTo(x, y), go, bfs, walkable, tileAt, spawnSlimes, applyAmbiance, enterLevel, interact, talk, meet, combatAct, completeQuest, LEVELS };

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
})();
</script>
